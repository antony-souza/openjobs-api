name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: openjobs
      POSTGRES_USER: openjobs
      POSTGRES_PASSWORD: openjobs_test_password

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openjobs
          POSTGRES_USER: openjobs
          POSTGRES_PASSWORD: openjobs_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openjobs -d openjobs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
