name: openjobs

services:
  postgres:
    image: postgres:17.10-alpine
    container_name: openjobs-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openjobs}
      POSTGRES_USER: ${POSTGRES_USER:-openjobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openjobs_dev_password}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - openjobs_postgres_data:/var/lib/postgresql/data

    mem_limit: 512m
    cpus: 0.50

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - openjobs

  rabbitmq:
    image: rabbitmq:4.3.4-alpine
    container_name: openjobs-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-openjobs}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-openjobs_dev_password}

    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"

    volumes:
      - openjobs_rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    mem_limit: 512m
    cpus: 1.0

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      start_period: 120s
      interval: 10s
      timeout: 30s
      retries: 12

    networks:
      - openjobs

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openjobs-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-openjobs}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-openjobs}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-openjobs_dev_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-openjobs}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-openjobs_dev_password}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_KEY: ${JWT_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

    ports:
      - "${API_PORT:-8080}:8080"

    mem_limit: 768m
    cpus: 1.0

    networks:
      - openjobs

volumes:
  openjobs_postgres_data:
  openjobs_rabbitmq_data:

networks:
  openjobs:
    driver: bridge
