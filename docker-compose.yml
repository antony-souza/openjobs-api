name: openjobs

services:
  postgres:
    image: postgres:17.10-alpine
    container_name: openjobs-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openjobs}
      POSTGRES_USER: ${POSTGRES_USER:-openjobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openjobs_dev_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - openjobs_postgres_data:/var/lib/postgresql/data

    mem_limit: 512m
    cpus: 0.50

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - openjobs

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    container_name: openjobs-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-openjobs}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-openjobs_dev_password}

    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

    volumes:
      - openjobs_rabbitmq_data:/var/lib/rabbitmq

    mem_limit: 512m
    cpus: 0.50

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - openjobs

  redis:
    image: redis:8.8.1-alpine
    container_name: openjobs-redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-openjobs_dev_password}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-openjobs_dev_password}

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - openjobs_redis_data:/data

    mem_limit: 256m
    cpus: 0.25

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - openjobs

volumes:
  openjobs_postgres_data:
  openjobs_rabbitmq_data:
  openjobs_redis_data:

networks:
  openjobs:
    driver: bridge