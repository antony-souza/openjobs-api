name: openjobs

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openjobs-api
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_started

    networks:
      - openjobs
      - proxy

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-proxy
      traefik.http.routers.openjobs-api.rule: "Host(`${API_HOST:-api.openjobs.shop}`)"
      traefik.http.routers.openjobs-api.entrypoints: web
      traefik.http.routers.openjobs-api.service: openjobs-api
      traefik.http.services.openjobs-api.loadbalancer.server.port: "${SERVER_PORT:-8082}"

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- "http://127.0.0.1:$${SERVER_PORT}/api/actuator/health/readiness" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 50s

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:?Configure POSTGRES_HOST no .env}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}?sslmode=${POSTGRES_SSLMODE:-require}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SERVER_PORT: ${SERVER_PORT:-8082}
      SERVER_ADDRESS: 0.0.0.0
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-openjobs}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-openjobs_dev_password}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_KEY: ${JWT_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

    mem_limit: 768m
    cpus: 1.0

  rabbitmq:
    image: rabbitmq:4.3.4-alpine
    container_name: openjobs-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-openjobs}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-openjobs_dev_password}

    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"

    volumes:
      - openjobs_rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    mem_limit: 512m
    cpus: 1.0

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      start_period: 120s
      interval: 60s
      timeout: 30s
      retries: 12

    networks:
      - openjobs

volumes:
  openjobs_rabbitmq_data:

networks:
  openjobs:
    driver: bridge
    enable_ipv6: true
  proxy:
    external: true
    name: traefik-proxy
